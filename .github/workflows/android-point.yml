name: Android ROFE Point (prototype, no terminal deployment)

on:
  push:
    paths: ['android-kiosk/**', '.github/workflows/android-point.yml']
  pull_request:
    paths: ['android-kiosk/**', '.github/workflows/android-point.yml']
  workflow_dispatch:
    inputs:
      emulator:
        description: 'Test prototype on emulator only'
        type: boolean
        default: false
      signed_candidate:
        description: 'Build signed Main App for review only (requires protected environment approval)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-kiosk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch and hash-verify official SDK (never install a vendor APK)
        run: ./scripts/fetch-point-sdk.sh
      - name: Tests, lint and actual APKs
        run: >-
          ./gradlew --no-daemon :point:testPrototypeDebugUnitTest :point:testMainappDebugUnitTest
          :point:lintPrototypeDebug :point:lintMainappDebug
          :point:assemblePrototypeDebug :point:assemblePrototypeRelease :point:assembleMainappDebug
          :app:testDebugUnitTest :barista:testDebugUnitTest
      - name: Collect clearly identified artifacts
        run: |
          mkdir -p dist/point
          cp point/build/outputs/apk/prototype/debug/point-prototype-debug.apk dist/point/ROFE-Point-PROTOTIPO-debug.apk
          cp point/build/outputs/apk/prototype/release/point-prototype-release-unsigned.apk dist/point/ROFE-Point-PROTOTIPO-UNSIGNED.apk
          cp point/build/outputs/apk/mainapp/debug/point-mainapp-debug.apk dist/point/ROFE-Point-CANDIDATO-NO-INSTALAR-EN-PRODUCCION.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/point/ROFE-Point-PROTOTIPO-debug.apk
          (cd dist/point && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: rofe-point-prototype
          path: android-kiosk/dist/point/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rofe-point-reports
          path: |
            android-kiosk/point/build/reports/
            android-kiosk/point/build/test-results/
            android-kiosk/point/build/point-evidence/
          retention-days: 30

  emulator:
    if: github.event_name == 'workflow_dispatch' && inputs.emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          disable-animations: true
          working-directory: android-kiosk
          script: ./scripts/point-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rofe-point-emulator
          path: |
            android-kiosk/dist/point/emulator/
            android-kiosk/point/build/reports/androidTests/

  signed-candidate:
    needs: prototype
    if: github.event_name == 'workflow_dispatch' && inputs.signed_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: rofe-point-homologation
    defaults:
      run:
        working-directory: android-kiosk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/fetch-point-sdk.sh
      - name: Restore separate Point signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ROFE_POINT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing Point signing secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/point-release.p12"
      - name: Build candidate for Mercado Pago review; never distribute to terminals
        env:
          ROFE_POINT_CLIENT_ID: ${{ vars.ROFE_POINT_CLIENT_ID }}
          ROFE_POINT_VERSION_CODE: ${{ github.run_number }}
          ROFE_POINT_VERSION_NAME: 1.0.${{ github.run_number }}
          ROFE_POINT_KEYSTORE_FILE: ${{ runner.temp }}/point-release.p12
          ROFE_POINT_KEYSTORE_PASSWORD: ${{ secrets.ROFE_POINT_KEYSTORE_PASSWORD }}
          ROFE_POINT_KEY_ALIAS: ${{ secrets.ROFE_POINT_KEY_ALIAS }}
          ROFE_POINT_KEY_PASSWORD: ${{ secrets.ROFE_POINT_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :point:testMainappReleaseUnitTest :point:lintMainappRelease :point:assembleMainappRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs point/build/outputs/apk/mainapp/release/point-mainapp-release.apk
          sha256sum point/build/outputs/apk/mainapp/release/point-mainapp-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rofe-point-signed-review-candidate
          path: android-kiosk/point/build/outputs/apk/mainapp/release/point-mainapp-release.apk
          retention-days: 14
      - name: Remove temporary runner key
        if: always()
        run: rm -f "$RUNNER_TEMP/point-release.p12"
