name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Lint
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Typecheck backend
        run: npm --prefix backend run typecheck
      - name: Unit and security tests
        run: npm test && npm --prefix backend test
      - name: Build backend
        run: npm --prefix backend run build
      - name: Verify isolated serverless entry
        run: node scripts/test-serverless-entry.mjs
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev && npm --prefix backend audit --omit=dev
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser critical flows
        run: npm run test:e2e
      - name: Install isolated PostgreSQL test tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-server-dev-16 build-essential
      - name: Build production query guard (pinned pg-safeupdate)
        run: |
          git init "$RUNNER_TEMP/pg-safeupdate"
          git -C "$RUNNER_TEMP/pg-safeupdate" remote add origin https://github.com/eradman/pg-safeupdate.git
          git -C "$RUNNER_TEMP/pg-safeupdate" fetch --depth 1 origin 37dbc9c4acf5e2504adf2b218e9c6b41751022f3
          git -C "$RUNNER_TEMP/pg-safeupdate" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/pg-safeupdate" PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no
          echo "SAFEUPDATE_LIBRARY=$RUNNER_TEMP/pg-safeupdate/safeupdate.so" >> "$GITHUB_ENV"
      - name: PostgreSQL transactional checks
        run: PATH="/usr/lib/postgresql/16/bin:$PATH" npm --prefix backend run test:db
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rofe-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
