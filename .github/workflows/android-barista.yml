name: Android Barista

on:
  push:
    paths:
      - 'android-kiosk/**'
      - '.github/workflows/android-barista.yml'
  pull_request:
    paths:
      - 'android-kiosk/**'
      - '.github/workflows/android-barista.yml'
  workflow_dispatch:
    inputs:
      emulator:
        description: 'Run instrumented tests on an Android emulator'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kiosk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit and Robolectric tests
        run: ./gradlew --no-daemon :barista:testDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon :barista:lintDebug
      - name: Restore release keystore (only when the secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.ROFE_BARISTA_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rofe-barista-release.jks"
      - name: Build debug, staging and release APKs
        env:
          ROFE_BARISTA_VERSION_CODE: ${{ github.run_number }}
          ROFE_BARISTA_KEYSTORE_FILE: ${{ secrets.ROFE_BARISTA_KEYSTORE_BASE64 != '' && format('{0}/rofe-barista-release.jks', runner.temp) || '' }}
          ROFE_BARISTA_KEYSTORE_PASSWORD: ${{ secrets.ROFE_BARISTA_KEYSTORE_PASSWORD }}
          ROFE_BARISTA_KEY_ALIAS: ${{ secrets.ROFE_BARISTA_KEY_ALIAS }}
          ROFE_BARISTA_KEY_PASSWORD: ${{ secrets.ROFE_BARISTA_KEY_PASSWORD }}
          ROFE_BARISTA_ADMIN_PIN_HASH: ${{ secrets.ROFE_BARISTA_ADMIN_PIN_HASH }}
        run: ./gradlew --no-daemon :barista:assembleDebug :barista:assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp barista/build/outputs/apk/debug/barista-debug.apk dist/ROFE-Barista.apk
          if [ -f barista/build/outputs/apk/release/barista-release.apk ]; then
            # Signed with the release keystore from GitHub secrets (never printed).
            cp barista/build/outputs/apk/release/barista-release.apk dist/rofe-barista-release.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/rofe-barista-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          else
            cp barista/build/outputs/apk/release/barista-release-unsigned.apk dist/rofe-barista-release-UNSIGNED.apk
            echo "::warning::Release APK is unsigned: add ROFE_BARISTA_KEYSTORE_BASE64, ROFE_BARISTA_KEYSTORE_PASSWORD, ROFE_BARISTA_KEY_ALIAS and ROFE_BARISTA_KEY_PASSWORD secrets."
          fi
          (cd dist && sha256sum *.apk | tee SHA256SUMS)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/ROFE-Barista.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: rofe-barista-apk
          path: android-kiosk/dist/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rofe-barista-reports
          path: |
            android-kiosk/barista/build/reports/
            android-kiosk/barista/build/test-results/
          retention-days: 14

  emulator:
    if: github.event_name == 'workflow_dispatch' && inputs.emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Coexistence install smoke (tablet emulator, API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          working-directory: android-kiosk
          script: ./scripts/coexistence-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rofe-barista-instrumented-reports
          path: android-kiosk/dist/coexistence/
