org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ROFE Kiosk build configuration (override with -P<name>=… or the ROFE_* environment variables).
# URL loaded by each build type. Release and staging must be HTTPS; debug may point to a LAN server.
rofe.releaseUrl=https://rofe.vercel.app/kiosk
rofe.stagingUrl=https://rofe.vercel.app/kiosk
rofe.debugUrl=https://rofe.vercel.app/kiosk
# Extra hosts the page may load resources from (product images in Supabase Storage).
rofe.extraHosts=*.supabase.co
# Seconds without interaction before the web app asks "¿Sigues ahí?".
rofe.idleSeconds=90
